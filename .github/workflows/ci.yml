name: Test CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.88 with formatter and Clippy
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo +1.88.0 fmt --all --check
      - run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.88.0 test --locked
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - run: cargo +1.88.0 build --locked
      - run: target/debug/oreslang test --root . --race --trace tests/traces/ordered.jsonl
      - run: target/debug/oreslang test --root . --race --logical --model tests/models/atomic-update.json
      - name: Race findings must exit 1 (not an invocation error)
        shell: bash
        run: |
          set +e
          target/debug/oreslang test --root . --race --trace tests/traces/racy.jsonl
          code=$?
          test "$code" -eq 1
      - name: Logical counterexample must exit 1
        shell: bash
        run: |
          set +e
          target/debug/oreslang test --root . --race --logical --model tests/models/lost-update.json
          code=$?
          test "$code" -eq 1
