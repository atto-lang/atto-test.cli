name: Test CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: target/debug/oreslang test --root . --race --trace tests/traces/ordered.jsonl
      - run: target/debug/oreslang test --root . --race --logical --model tests/models/atomic-update.json
      - name: Race findings must exit 1 (not an invocation error)
        shell: bash
        run: |
          set +e
          target/debug/oreslang test --root . --race --trace tests/traces/racy.jsonl
          code=$?
          test "$code" -eq 1
      - name: Logical counterexample must exit 1
        shell: bash
        run: |
          set +e
          target/debug/oreslang test --root . --race --logical --model tests/models/lost-update.json
          code=$?
          test "$code" -eq 1
