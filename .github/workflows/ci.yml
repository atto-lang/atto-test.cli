name: Rust Test CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install explicit Rust 1.88 toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Enforce Rust-only implementation
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -- '*.py' | grep -q .; then
            echo "Python source files are forbidden in oreslang-test.cli:" >&2
            git ls-files -- '*.py' >&2
            exit 1
          fi
          if git grep -n -I -E '^#!.*python([0-9.]*)?([[:space:]]|$)' -- .; then
            echo "Python shebangs are forbidden in executable tooling." >&2
            exit 1
          fi
      - name: Reproducible dependency graph
        run: |
          test -f Cargo.lock || {
            echo "Cargo.lock is required for the shipping CLI; refusing floating dependency resolution." >&2
            exit 1
          }
          cargo +1.88.0 metadata --locked --format-version 1 >/dev/null
      - name: Rust formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.88.0 clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and regression tests
        run: cargo +1.88.0 test --all-targets --locked
      - name: Release binary
        run: cargo +1.88.0 build --release --locked
      - name: CLI smoke tests
        run: |
          ./target/release/oreslang-test --help
          ./bin/oreslang test --root . --race --trace tests/traces/ordered.jsonl
          ./bin/oreslang test --root . --race --logical --model tests/models/atomic-update.json
          if ./bin/oreslang test --root . --race --trace tests/traces/racy.jsonl; then exit 1; fi
          if ./bin/oreslang test --root . --model-check --model tests/models/lost-update.json; then exit 1; fi
