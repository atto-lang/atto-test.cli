name: Rust Oreslang test CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust unit and integration tests
        run: cargo test --locked
      - name: Build both Rust entrypoints
        run: cargo build --locked --bins
      - name: Offline observed ordered trace
        run: cargo run --locked --bin oreslang -- test --root . --race --trace tests/traces/ordered.jsonl
      - name: Observed data race must exit 1
        shell: bash
        run: |
          set +e
          cargo run --locked --quiet --bin oreslang -- test --root . --race --trace tests/traces/racy.jsonl
          code=$?
          test "$code" -eq 1
      - name: Runtime race without attestation must exit 2
        shell: bash
        run: |
          set +e
          cargo run --locked --quiet --bin oreslang -- test --root . --race
          code=$?
          test "$code" -eq 2
      - name: Logical model is explicitly inconclusive until Rust engine exists
        shell: bash
        run: |
          set +e
          cargo run --locked --quiet --bin oreslang -- test --root . --race --logical --model tests/models/atomic-update.json
          code=$?
          test "$code" -eq 2
