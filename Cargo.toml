[package]
name = "oreslang-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native Oreslang testing and validation CLI"
license = "MIT"

[[bin]]
name = "oreslang-test"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
serde = "1.0"
toml = "0.8"
rand = "0.8"
sha2 = "0.10"
regex = "1.11"
tempfile = "3.14"
libc = "0.2"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
